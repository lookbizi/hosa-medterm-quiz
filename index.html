<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>HOSA Medical Terminology Quiz</title>
  <style>

:root {
  --bg: #0b1220;
  --bg-card: #132033;
  --bg-soft: #1e3348;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #2dd4bf;
  --accent-2: #38bdf8;
  --accent-deep: #0d9488;
  --good: #34d399;
  --good-bg: rgba(52, 211, 153, 0.16);
  --bad: #f87171;
  --bad-bg: rgba(248, 113, 113, 0.16);
  --warn: #fbbf24;
  --radius: 16px;
  --shadow: 0 12px 32px rgba(0,0,0,0.4);
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0; min-height: 100%;
  background:
    radial-gradient(1000px 500px at 0% -10%, rgba(13,148,136,0.45) 0%, transparent 55%),
    radial-gradient(800px 420px at 100% 0%, rgba(14,165,233,0.28) 0%, transparent 50%),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.45;
}
body { padding: 1rem; padding-bottom: max(1rem, env(safe-area-inset-bottom)); }
.app { max-width: 720px; margin: 0 auto; min-height: calc(100vh - 2rem); }
.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.22s ease; }
.screen[hidden] { display: none !important; }
.screen.active:not([hidden]) { display: block !important; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.hero { text-align: center; padding: 1.25rem 0.4rem 0.75rem; }
.eyebrow {
  color: var(--accent); text-transform: uppercase; letter-spacing: 0.09em;
  font-size: 0.72rem; font-weight: 700; margin: 0 0 0.45rem;
}
h1 { font-size: clamp(1.65rem, 5vw, 2.25rem); margin: 0 0 0.45rem; line-height: 1.15; }
.subtitle { color: var(--muted); margin: 0 auto; max-width: 34rem; font-size: 1.02rem; }
.mastery-card {
  margin: 1rem 0 1.25rem; padding: 1rem 1.15rem;
  background: rgba(19, 32, 51, 0.9);
  border: 1px solid rgba(45, 212, 191, 0.25);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.mastery-top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; flex-wrap: wrap;
}
.mastery-label { font-weight: 700; font-size: 0.95rem; }
.mastery-tier { color: var(--accent); font-weight: 700; font-size: 0.85rem; }
.meter {
  margin-top: 0.65rem; height: 10px; background: var(--bg-soft);
  border-radius: 999px; overflow: hidden;
}
.meter > span {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent), var(--accent-2));
  border-radius: inherit; transition: width 0.35s ease;
}
.mastery-stats {
  display: flex; flex-wrap: wrap; gap: 0.5rem 1rem;
  margin-top: 0.7rem; color: var(--muted); font-size: 0.85rem;
}
.mode-grid { display: grid; gap: 0.85rem; padding: 0.25rem 0 1rem; }
.mode-card {
  display: flex; align-items: center; gap: 1rem; width: 100%; text-align: left;
  padding: 1.05rem 1.2rem; min-height: 76px;
  border: 1px solid rgba(148,163,184,0.28);
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(19,32,51,0.98), rgba(30,51,72,0.75));
  color: var(--text); box-shadow: var(--shadow);
  cursor: pointer; font: inherit;
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.mode-card:hover, .mode-card:focus-visible {
  transform: translateY(-2px); border-color: var(--accent); outline: none;
}
.mode-icon {
  flex-shrink: 0; width: 48px; height: 48px; border-radius: 12px;
  display: grid; place-items: center; font-size: 1.45rem;
  background: rgba(45, 212, 191, 0.15);
}
.mode-card h2 { margin: 0; font-size: 1.08rem; }
.mode-card p { margin: 0.2rem 0 0; color: var(--muted); font-size: 0.88rem; }
.home-actions { display: grid; gap: 0.55rem; padding-bottom: 1.5rem; }
.opt-row {
  display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
  padding: 0.75rem 1rem; border-radius: 12px;
  background: rgba(19,32,51,0.7); border: 1px solid rgba(148,163,184,0.2);
  color: var(--muted); font-size: 0.92rem;
}
.opt-row label { display: flex; align-items: center; gap: 0.55rem; cursor: pointer; color: var(--text); }
.quiz-bar {
  display: flex; align-items: flex-start; gap: 0.75rem;
  margin-bottom: 1rem; padding-top: 0.2rem;
}
.progress-wrap { flex: 1; }
.progress-meta {
  display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.35rem;
  color: var(--muted); font-size: 0.88rem; font-weight: 600; margin-bottom: 0.35rem;
}
.progress-track {
  height: 8px; background: var(--bg-soft); border-radius: 999px; overflow: hidden;
}
.progress-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent-2));
  border-radius: inherit; transition: width 0.25s ease;
}
.timer-chip { font-variant-numeric: tabular-nums; color: var(--warn); font-weight: 700; }
.quiz-body {
  background: rgba(19, 32, 51, 0.9);
  border: 1px solid rgba(148,163,184,0.22);
  border-radius: calc(var(--radius) + 4px);
  padding: 1.2rem; box-shadow: var(--shadow);
}
.chip {
  display: inline-block; margin: 0 0.35rem 0.75rem 0;
  padding: 0.22rem 0.65rem; border-radius: 999px;
  background: rgba(45, 212, 191, 0.18); color: #99f6e4;
  font-size: 0.78rem; font-weight: 650;
}
.chip.tier { background: rgba(56, 189, 248, 0.18); color: #bae6fd; }
.prompt {
  margin: 0 0 1.15rem; font-size: clamp(1.12rem, 3.4vw, 1.35rem);
  line-height: 1.35; font-weight: 650;
}
.choices { display: grid; gap: 0.7rem; }
.choice {
  display: flex; align-items: flex-start; gap: 0.8rem; width: 100%; text-align: left;
  padding: 0.95rem 1rem; min-height: 60px; border-radius: 14px;
  border: 2px solid rgba(148,163,184,0.35);
  background: rgba(11, 18, 32, 0.55); color: var(--text);
  font: inherit; font-size: 1.02rem; cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
}
.choice:hover:not(:disabled), .choice:focus-visible:not(:disabled) {
  border-color: var(--accent); outline: none; transform: translateY(-1px);
}
.choice:disabled { cursor: default; }
.choice .letter {
  flex-shrink: 0; width: 2rem; height: 2rem; border-radius: 8px;
  display: grid; place-items: center; font-weight: 700;
  background: var(--bg-soft); color: var(--accent);
}
.choice .choice-text { flex: 1; padding-top: 0.12rem; }
.choice.correct { border-color: var(--good); background: var(--good-bg); }
.choice.correct .letter { background: rgba(52,211,153,0.25); color: var(--good); }
.choice.incorrect { border-color: var(--bad); background: var(--bad-bg); }
.choice.incorrect .letter { background: rgba(248,113,113,0.25); color: var(--bad); }
.choice.dimmed { opacity: 0.5; }
.feedback {
  margin-top: 1rem; padding: 0.95rem 1.05rem; border-radius: 12px; font-size: 0.98rem;
}
.feedback.good { background: var(--good-bg); border: 1px solid rgba(52,211,153,0.4); color: #bbf7d0; }
.feedback.bad { background: var(--bad-bg); border: 1px solid rgba(248,113,113,0.4); color: #fecaca; }
.feedback strong { display: block; margin-bottom: 0.3rem; font-size: 1.02rem; }
.btn-primary, .btn-secondary, .btn-text {
  font: inherit; cursor: pointer; border-radius: 12px; border: none;
  transition: transform 0.1s ease, opacity 0.15s ease;
}
.btn-primary {
  display: block; width: 100%; margin-top: 0.85rem;
  padding: 0.92rem 1.2rem; min-height: 52px;
  background: linear-gradient(135deg, #0d9488, #0284c7);
  color: white; font-weight: 700; font-size: 1.05rem;
}
.btn-secondary {
  display: block; width: 100%; margin-top: 0.65rem;
  padding: 0.92rem 1.2rem; min-height: 52px;
  background: var(--bg-soft); color: var(--text); font-weight: 650; font-size: 1.02rem;
  border: 1px solid rgba(148,163,184,0.35);
}
.btn-text {
  background: transparent; color: var(--muted); padding: 0.35rem 0.45rem; font-weight: 600;
}
.btn-primary:hover, .btn-secondary:hover, .btn-text:hover { opacity: 0.93; transform: translateY(-1px); }
.btn-danger-text { color: #fca5a5; }
.nav-row { display: flex; gap: 0.7rem; margin-top: 1rem; }
.nav-row .btn-primary, .nav-row .btn-secondary { margin-top: 0; flex: 1; }
.results-actions { max-width: 420px; margin: 0 auto; padding: 0.4rem 0 2rem; }
.score-big {
  font-size: clamp(2.4rem, 10vw, 3.4rem); font-weight: 800;
  margin: 0.65rem 0; color: var(--accent);
}
.score-denom { font-size: 0.5em; color: var(--muted); font-weight: 600; }
.review-box {
  text-align: left; margin: 1rem auto 0.5rem; max-width: 420px;
  padding: 1rem 1.1rem; border-radius: 14px;
  background: rgba(19,32,51,0.85); border: 1px solid rgba(148,163,184,0.25);
}
.review-box h3 { margin: 0 0 0.5rem; font-size: 0.95rem; color: var(--accent); }
.review-box ul { margin: 0; padding-left: 1.15rem; color: var(--muted); font-size: 0.92rem; }
.review-box li { margin: 0.25rem 0; }
.tier-pills { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin: 0.75rem 0; }
.tier-pill {
  padding: 0.3rem 0.65rem; border-radius: 999px; font-size: 0.78rem; font-weight: 650;
  background: rgba(30,51,72,0.9); border: 1px solid rgba(148,163,184,0.3); color: var(--muted);
}
.tier-pill.open { border-color: rgba(45,212,191,0.55); color: #99f6e4; }
.tier-pill.current { background: rgba(45,212,191,0.2); color: var(--accent); border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

  </style>
</head>
<body>

  <div id="app" class="app">
    <section id="screen-home" class="screen active" aria-label="Home">
      <header class="hero">
        <p class="eyebrow">HOSA · 8th Grade Prep</p>
        <h1>HOSA Medical Terminology</h1>
        <p class="subtitle">Learn word parts, unlock harder questions as you improve, and build HOSA-ready vocab — offline and adaptive.</p>
      </header>

      <div class="mastery-card" id="home-mastery">
        <div class="mastery-top">
          <span class="mastery-label">Your mastery</span>
          <span class="mastery-tier" id="home-tier-label">Level 1 · Foundations</span>
        </div>
        <div class="meter" aria-hidden="true"><span id="home-meter"></span></div>
        <div class="mastery-stats" id="home-stats"></div>
        <div class="tier-pills" id="home-tier-pills"></div>
      </div>

      <div class="mode-grid" role="list">
        <button type="button" class="mode-card" id="btn-practice" role="listitem">
          <span class="mode-icon" aria-hidden="true">🧠</span>
          <span>
            <h2>Start Practice</h2>
            <p>Adaptive mix — grows harder as you master each level</p>
          </span>
        </button>
        <button type="button" class="mode-card" id="btn-focus" role="listitem">
          <span class="mode-icon" aria-hidden="true">🎯</span>
          <span>
            <h2>Focus Weak Spots</h2>
            <p>Drill tags and terms you've missed most</p>
          </span>
        </button>
        <button type="button" class="mode-card" id="btn-challenge" role="listitem">
          <span class="mode-icon" aria-hidden="true">⏱️</span>
          <span>
            <h2>Challenge Quiz</h2>
            <p>Harder mix · optional timer for HOSA-style pace</p>
          </span>
        </button>
      </div>

      <div class="home-actions">
        <div class="opt-row">
          <label><input type="checkbox" id="opt-timer" /> Timed challenge (60s / question)</label>
          <span id="bank-count"></span>
        </div>
        <button type="button" class="btn-text btn-danger-text" id="btn-reset">Reset Progress</button>
      </div>
    </section>

    <section id="screen-quiz" class="screen" aria-label="Quiz" hidden>
      <header class="quiz-bar">
        <button type="button" id="btn-quit" class="btn-text" aria-label="Quit to home">← Home</button>
        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="progress-label">1 of 12</span>
            <span id="score-label">Score: 0</span>
            <span id="timer-label" class="timer-chip" hidden></span>
          </div>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>
      </header>
      <div class="quiz-body">
        <div>
          <span id="tag-chip" class="chip"></span>
          <span id="tier-chip" class="chip tier"></span>
        </div>
        <h2 id="question-prompt" class="prompt"></h2>
        <div id="choices" class="choices" role="group" aria-label="Answer choices"></div>
        <div id="feedback" class="feedback" hidden role="status"></div>
        <div class="nav-row">
          <button type="button" id="btn-home-mid" class="btn-secondary">Home</button>
          <button type="button" id="btn-next" class="btn-primary" hidden>Next</button>
        </div>
      </div>
    </section>

    <section id="screen-results" class="screen" aria-label="Results" hidden>
      <header class="hero">
        <p class="eyebrow" id="results-mode">Practice</p>
        <h1 id="results-headline">Nice work!</h1>
        <p class="score-big"><span id="results-score">0</span><span class="score-denom"> / <span id="results-total">12</span></span></p>
        <p id="results-message" class="subtitle"></p>
        <div class="tier-pills" id="results-tier-pills"></div>
      </header>
      <div class="mastery-card" style="max-width:420px;margin-left:auto;margin-right:auto;">
        <div class="mastery-top">
          <span class="mastery-label">Level progress</span>
          <span class="mastery-tier" id="results-tier-label"></span>
        </div>
        <div class="meter"><span id="results-meter"></span></div>
        <div class="mastery-stats" id="results-stats"></div>
      </div>
      <div class="review-box" id="review-box" hidden>
        <h3>Review these word-part areas</h3>
        <ul id="review-list"></ul>
      </div>
      <div class="results-actions">
        <button type="button" class="btn-primary" id="btn-again">Play again</button>
        <button type="button" class="btn-secondary" id="btn-results-home">Back to home</button>
      </div>
    </section>
  </div>

  <script>
window.HOSA_BANK = [{"id": "q001", "tier": 1, "tags": ["prefix", "hyper"], "prompt": "The prefix \"hyper-\" means:", "choices": {"A": "below normal", "B": "above / excessive", "C": "around", "D": "within"}, "correct": "B", "explain": "hyper- = above or excessive (think: hyperactive = overly active)."}, {"id": "q002", "tier": 1, "tags": ["prefix", "hypo"], "prompt": "The prefix \"hypo-\" means:", "choices": {"A": "above normal", "B": "against", "C": "below / under", "D": "many"}, "correct": "C", "explain": "hypo- = below or under (hypothermia = body temp below normal)."}, {"id": "q003", "tier": 1, "tags": ["prefix", "brady"], "prompt": "The prefix \"brady-\" means:", "choices": {"A": "fast", "B": "slow", "C": "half", "D": "new"}, "correct": "B", "explain": "brady- = slow (bradycardia = slow heart rate)."}, {"id": "q004", "tier": 1, "tags": ["prefix", "tachy"], "prompt": "The prefix \"tachy-\" means:", "choices": {"A": "slow", "B": "painful", "C": "fast / rapid", "D": "without"}, "correct": "C", "explain": "tachy- = fast (tachycardia = fast heart rate)."}, {"id": "q005", "tier": 1, "tags": ["prefix", "a-an"], "prompt": "The prefixes \"a-\" and \"an-\" mean:", "choices": {"A": "against", "B": "before", "C": "without / not", "D": "after"}, "correct": "C", "explain": "a-/an- = without or not (anemia = without enough healthy red blood cells)."}, {"id": "q006", "tier": 1, "tags": ["prefix", "anti"], "prompt": "The prefix \"anti-\" means:", "choices": {"A": "before", "B": "against", "C": "within", "D": "around"}, "correct": "B", "explain": "anti- = against (antibiotic = against bacteria)."}, {"id": "q007", "tier": 1, "tags": ["prefix", "peri"], "prompt": "The prefix \"peri-\" means:", "choices": {"A": "inside", "B": "above", "C": "around / surrounding", "D": "between"}, "correct": "C", "explain": "peri- = around (pericardium = membrane around the heart)."}, {"id": "q008", "tier": 1, "tags": ["prefix", "endo"], "prompt": "The prefix \"endo-\" means:", "choices": {"A": "outside", "B": "within / inside", "C": "across", "D": "below"}, "correct": "B", "explain": "endo- = within or inside (endoscope = instrument to look inside)."}, {"id": "q009", "tier": 1, "tags": ["prefix", "epi"], "prompt": "The prefix \"epi-\" means:", "choices": {"A": "under", "B": "upon / on / over", "C": "half", "D": "many"}, "correct": "B", "explain": "epi- = upon or over (epidermis = outer layer of skin)."}, {"id": "q010", "tier": 1, "tags": ["prefix", "sub"], "prompt": "The prefix \"sub-\" means:", "choices": {"A": "above", "B": "across", "C": "under / below", "D": "same"}, "correct": "C", "explain": "sub- = under (subcutaneous = under the skin)."}, {"id": "q011", "tier": 1, "tags": ["prefix", "supra"], "prompt": "The prefix \"supra-\" means:", "choices": {"A": "below", "B": "within", "C": "above / over", "D": "around"}, "correct": "C", "explain": "supra- = above (suprapubic = above the pubic bone)."}, {"id": "q012", "tier": 1, "tags": ["prefix", "inter"], "prompt": "The prefix \"inter-\" means:", "choices": {"A": "within", "B": "between", "C": "against", "D": "after"}, "correct": "B", "explain": "inter- = between (intercostal = between the ribs)."}, {"id": "q013", "tier": 1, "tags": ["prefix", "intra"], "prompt": "The prefix \"intra-\" means:", "choices": {"A": "between", "B": "outside", "C": "within / inside", "D": "around"}, "correct": "C", "explain": "intra- = within (intravenous = within a vein)."}, {"id": "q014", "tier": 1, "tags": ["prefix", "dys"], "prompt": "The prefix \"dys-\" means:", "choices": {"A": "good / normal", "B": "bad / difficult / painful", "C": "many", "D": "half"}, "correct": "B", "explain": "dys- = bad, difficult, or painful (dyspnea = difficult breathing)."}, {"id": "q015", "tier": 1, "tags": ["prefix", "poly"], "prompt": "The prefix \"poly-\" means:", "choices": {"A": "one", "B": "half", "C": "many / much", "D": "none"}, "correct": "C", "explain": "poly- = many (polyuria = much urine / frequent urination)."}, {"id": "q016", "tier": 1, "tags": ["prefix", "hemi"], "prompt": "The prefix \"hemi-\" means:", "choices": {"A": "whole", "B": "half", "C": "double", "D": "none"}, "correct": "B", "explain": "hemi- = half (hemiplegia = paralysis of one half of the body)."}, {"id": "q017", "tier": 1, "tags": ["prefix", "pre"], "prompt": "The prefix \"pre-\" means:", "choices": {"A": "after", "B": "against", "C": "before", "D": "around"}, "correct": "C", "explain": "pre- = before (prenatal = before birth)."}, {"id": "q018", "tier": 1, "tags": ["prefix", "post"], "prompt": "The prefix \"post-\" means:", "choices": {"A": "before", "B": "after", "C": "against", "D": "within"}, "correct": "B", "explain": "post- = after (postoperative = after surgery)."}, {"id": "q019", "tier": 1, "tags": ["prefix", "trans"], "prompt": "The prefix \"trans-\" means:", "choices": {"A": "under", "B": "across / through", "C": "same", "D": "new"}, "correct": "B", "explain": "trans- = across or through (transfusion = pouring blood across into a patient)."}, {"id": "q020", "tier": 1, "tags": ["prefix", "micro"], "prompt": "The prefix \"micro-\" means:", "choices": {"A": "large", "B": "equal", "C": "small", "D": "fast"}, "correct": "C", "explain": "micro- = small (microscope = instrument to see small things)."}, {"id": "q021", "tier": 1, "tags": ["suffix", "itis"], "prompt": "The suffix \"-itis\" means:", "choices": {"A": "study of", "B": "inflammation", "C": "tumor", "D": "removal"}, "correct": "B", "explain": "-itis = inflammation (tonsillitis = inflamed tonsils)."}, {"id": "q022", "tier": 1, "tags": ["suffix", "ectomy"], "prompt": "The suffix \"-ectomy\" means:", "choices": {"A": "cutting into", "B": "surgical removal", "C": "repair", "D": "viewing"}, "correct": "B", "explain": "-ectomy = surgical removal (appendectomy = removal of the appendix)."}, {"id": "q023", "tier": 1, "tags": ["suffix", "ology"], "prompt": "The suffix \"-ology\" means:", "choices": {"A": "disease", "B": "pain", "C": "study of", "D": "blood condition"}, "correct": "C (function () {
  "use strict";

  const STORAGE_KEY = "hosa_medterm_v1";
  const BANK = window.HOSA_BANK || [];
  const TIER_NAMES = {
    1: "L1 Foundations",
    2: "L2 Common terms",
    3: "L3 Clinical",
    4: "L4 Challenge"
  };
  const TIER_BLURBS = {
    1: "Word parts & body basics",
    2: "Systems & everyday terms",
    3: "Multi-part clinical words",
    4: "HOSA-style stems"
  };
  const ENCOURAGE = [
    "Yes! You nailed it!",
    "Spot on — great word-part skills!",
    "Awesome — that one stuck!",
    "Correct! You're leveling up!",
    "Boom — got it!",
    "Excellent recall!"
  ];
  const SESSION_LEN = { practice: 12, focus: 12, challenge: 15 };
  const UNLOCK_ACC = 0.75;
  const UNLOCK_MIN = 8;
  const RECENT_WINDOW = 12;

  function defaultProgress() {
    return {
      unlockedTier: 1,
      totalCorrect: 0,
      totalAnswered: 0,
      recentByTier: { 1: [], 2: [], 3: [], 4: [] },
      terms: {},
      tags: {},
      lastMode: "practice"
    };
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultProgress();
      const p = Object.assign(defaultProgress(), JSON.parse(raw));
      p.recentByTier = Object.assign({ 1: [], 2: [], 3: [], 4: [] }, p.recentByTier || {});
      p.terms = p.terms || {};
      p.tags = p.tags || {};
      return p;
    } catch (e) {
      return defaultProgress();
    }
  }

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
    catch (e) { /* ignore quota */ }
  }

  let progress = loadProgress();

  const state = {
    mode: "practice",
    timed: false,
    questions: [],
    index: 0,
    score: 0,
    answered: false,
    timerId: null,
    timerLeft: 0,
    sessionWrongTags: {},
    lastMode: "practice"
  };

  const el = {
    home: document.getElementById("screen-home"),

    results: document.getElementById("screen-results"),

    homeTier: document.getElementById("home-tier-label"),
    homeStats: document.getElementById("home-stats"),
    homePills: document.getElementById("home-tier-pills"),
    bankCount: document.getElementById("bank-count"),
    optTimer: document.getElementById("opt-timer"),
    progressLabel: document.getElementById("progress-label"),

  };

  function showScreen(name) {
    const map = { home: el.home, quiz: el.quiz, results: el.results };
    Object.keys(map).forEach(function (key) {
      const s = map[key];
      const on = key === name;
      s.classList.toggle("active", on);
      if (on) {
        s.removeAttribute("hidden");
        s.style.display = "block";
      } else {
        s.setAttribute("hidden", "");
        s.style.display = "none";
      }
    });
    try { window.scrollTo(0, 0); } catch (e) {}
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function termStat(id) {
    if (!progress.terms[id]) progress.terms[id] = { correct: 0, wrong: 0, streak: 0 };
    return progress.terms[id];
  }

  function tagStat(tag) {
    if (!progress.tags[tag]) progress.tags[tag] = { correct: 0, wrong: 0 };
    return progress.tags[tag];
  }

  function tierAccuracy(tier) {
    const r = progress.recentByTier[tier] || [];
    if (!r.length) return null;
    const ok = r.filter(Boolean).length;
    return ok / r.length;
  }

  function maybeUnlock() {
    let unlocked = progress.unlockedTier || 1;
    for (let t = 1; t < 4; t++) {
      if (unlocked < t) break;
      const recent = progress.recentByTier[t] || [];
      if (recent.length >= UNLOCK_MIN) {
        const windowed = recent.slice(-RECENT_WINDOW);
        const acc = windowed.filter(Boolean).length / windowed.length;
        if (acc >= UNLOCK_ACC) {
          if (unlocked < t + 1) unlocked = t + 1;
        }
      }
    }
    progress.unlockedTier = Math.min(4, Math.max(1, unlocked));
  }

  function masteryPercent() {
    const u = progress.unlockedTier;
    const base = ((u - 1) / 4) * 100;
    const acc = tierAccuracy(u);
    const slice = acc == null ? 0 : acc * 25;
    return Math.min(100, Math.round(base + slice));
  }

  function renderTierPills(container) {
    container.innerHTML = "";
    for (let t = 1; t <= 4; t++) {
      const pill = document.createElement("span");
      pill.className = "tier-pill";
      if (t <= progress.unlockedTier) pill.classList.add("open");
      if (t === progress.unlockedTier) pill.classList.add("current");
      const acc = tierAccuracy(t);
      const accTxt = acc == null ? "—" : Math.round(acc * 100) + "%";
      pill.textContent = (t <= progress.unlockedTier ? "✓ " : "🔒 ") + "L" + t + " " + accTxt;
      pill.title = TIER_BLURBS[t];
      container.appendChild(pill);
    }
  }

  function refreshHome() {
    maybeUnlock();
    saveProgress();
    const u = progress.unlockedTier;
    el.homeTier.textContent = "Level " + u + " · " + TIER_BLURBS[u];
    el.homeMeter.style.width = masteryPercent() + "%";
    const answered = progress.totalAnswered || 0;
    const correct = progress.totalCorrect || 0;
    const pct = answered ? Math.round((correct / answered) * 100) : 0;
    el.homeStats.innerHTML =
      "<span>" + answered + " answered</span>" +
      "<span>" + pct + "% lifetime accuracy</span>" +
      "<span>" + BANK.length + " terms in bank</span>";
    renderTierPills(el.homePills);
    el.bankCount.textContent = BANK.length + " questions";
  }

  function weaknessScore(q) {
    const ts = termStat(q.id);
    let score = ts.wrong * 3 - ts.streak * 2 - ts.correct;
    (q.tags || []).forEach((tag) => {
      const tg = tagStat(tag);
      score += tg.wrong * 2 - tg.correct;
    });
    return score;
  }

  function pickQuestions(mode) {
    const n = SESSION_LEN[mode] || 12;
    const unlocked = progress.unlockedTier || 1;
    let pool = BANK.filter((q) => q.tier <= unlocked);

    if (mode === "focus") {
      const ranked = shuffle(pool).sort((a, b) => weaknessScore(b) - weaknessScore(a));
      const weak = ranked.filter((q) => weaknessScore(q) > 0);
      const chosen = (weak.length >= Math.ceil(n * 0.6) ? weak : ranked).slice(0, n);
      return shuffle(chosen);
    }

    if (mode === "challenge") {
      const hi = pool.filter((q) => q.tier >= Math.max(1, unlocked - 1));
      const lo = pool.filter((q) => q.tier < Math.max(1, unlocked - 1));
      const needHi = Math.ceil(n * 0.75);
      const picked = shuffle(hi).slice(0, needHi);
      const rest = shuffle(lo.concat(hi.filter((q) => picked.indexOf(q) === -1))).slice(0, n - picked.length);
      return shuffle(picked.concat(rest));
    }

    const byTier = { 1: [], 2: [], 3: [], 4: [] };
    pool.forEach((q) => byTier[q.tier].push(q));
    Object.keys(byTier).forEach((k) => { byTier[k] = shuffle(byTier[k]); });

    const weights = { 1: 0, 2: 0, 3: 0, 4: 0 };
    if (unlocked === 1) { weights[1] = 1; }
    else if (unlocked === 2) { weights[1] = 0.35; weights[2] = 0.65; }
    else if (unlocked === 3) { weights[1] = 0.15; weights[2] = 0.35; weights[3] = 0.5; }
    else { weights[1] = 0.1; weights[2] = 0.2; weights[3] = 0.35; weights[4] = 0.35; }

    const chosen = [];
    const used = {};
    for (let t = 1; t <= 4; t++) {
      const count = Math.round(n * weights[t]);
      const candidates = byTier[t].slice().sort((a, b) => weaknessScore(b) - weaknessScore(a));
      for (let i = 0; i < candidates.length; i++) {
        const q = candidates[i];
        if (chosen.length >= n) break;
        if (used[q.id]) continue;
        const have = chosen.filter((x) => x.tier === t).length;
        if (count > 0 && have >= count) continue;
        chosen.push(q);
        used[q.id] = true;
      }
    }
    const leftover = shuffle(pool.filter((q) => !used[q.id]));
    while (chosen.length < n && leftover.length) {
      chosen.push(leftover.pop());
    }
    return shuffle(chosen).slice(0, n);
  }

  function stopTimer() {
    if (state.timerId) {
      clearInterval(state.timerId);
      state.timerId = null;
    }
    el.timerLabel.hidden = true;
  }

  function startTimer() {
    stopTimer();
    if (!state.timed) return;
    state.timerLeft = 60;
    el.timerLabel.hidden = false;
    el.timerLabel.textContent = "60s";
    state.timerId = setInterval(function () {
      state.timerLeft -= 1;
      el.timerLabel.textContent = state.timerLeft + "s";
      if (state.timerLeft <= 0) {
        stopTimer();
        if (!state.answered) onAnswer(null, true);
      }
    }, 1000);
  }

  function recordAnswer(q, isCorrect) {
    progress.totalAnswered += 1;
    if (isCorrect) progress.totalCorrect += 1;

    const ts = termStat(q.id);
    if (isCorrect) {
      ts.correct += 1;
      ts.streak += 1;
    } else {
      ts.wrong += 1;
      ts.streak = 0;
      (q.tags || []).forEach(function (tag) {
        state.sessionWrongTags[tag] = (state.sessionWrongTags[tag] || 0) + 1;
      });
    }
    (q.tags || []).forEach(function (tag) {
      const tg = tagStat(tag);
      if (isCorrect) tg.correct += 1;
      else tg.wrong += 1;
    });

    const arr = progress.recentByTier[q.tier] || [];
    arr.push(!!isCorrect);
    if (arr.length > 40) arr.splice(0, arr.length - 40);
    progress.recentByTier[q.tier] = arr;

    maybeUnlock();
    saveProgress();
  }

  function startSession(mode) {
    try {
      stopTimer();
      state.mode = mode;
      state.lastMode = mode;
      progress.lastMode = mode;
      state.timed = mode === "challenge" && !!(el.optTimer && el.optTimer.checked);
      state.questions = pickQuestions(mode);
      state.index = 0;
      state.score = 0;
      state.answered = false;
      state.sessionWrongTags = {};
      if (!state.questions.length) {
        alert("No questions available yet. Try Practice mode.");
        return;
      }
      showScreen("quiz");
      renderQuestion();
    } catch (err) {
      console.error(err);
      alert("Could not start quiz: " + (err && err.message ? err.message : err));
    }
  }

  function currentQ() {
    return state.questions[state.index];
  }

  function renderQuestion() {
    const q = currentQ();
    const total = state.questions.length;
    const num = state.index + 1;
    state.answered = false;

    el.progressLabel.textContent = num + " of " + total;
    el.scoreLabel.textContent = "Score: " + state.score;
    el.progressFill.style.width = ((num - 1) / total) * 100 + "%";
    el.tagChip.textContent = (q.tags && q.tags[0]) ? q.tags[0] : "term";
    el.tierChip.textContent = TIER_NAMES[q.tier] || ("L" + q.tier);
    el.prompt.textContent = q.prompt;
    el.feedback.hidden = true;
    el.feedback.innerHTML = "";
    el.btnNext.hidden = true;

    el.choices.innerHTML = "";
    ["A", "B", "C", "D"].forEach(function (letter) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "choice";
      btn.dataset.letter = letter;
      btn.innerHTML =
        '<span class="letter">' + letter + "</span>" +
        '<span class="choice-text">' + q.choices[letter] + "</span>";
      btn.addEventListener("click", function () { onAnswer(letter, false); });
      el.choices.appendChild(btn);
    });

    startTimer();
  }

  function onAnswer(letter, timedOut) {
    if (state.answered) return;
    state.answered = true;
    stopTimer();

    const q = currentQ();
    const isCorrect = !timedOut && letter === q.correct;
    if (isCorrect) state.score += 1;

    recordAnswer(q, isCorrect);

    const buttons = el.choices.querySelectorAll(".choice");
    for (let i = 0; i < buttons.length; i++) {
      const btn = buttons[i];
      btn.disabled = true;
      const L = btn.dataset.letter;
      if (L === q.correct) btn.classList.add("correct");
      if (letter && L === letter && letter !== q.correct) btn.classList.add("incorrect");
      if (L !== q.correct && L !== letter) btn.classList.add("dimmed");
    }

    el.feedback.hidden = false;
    if (isCorrect) {
      el.feedback.className = "feedback good";
      el.feedback.innerHTML =
        "<strong>" + ENCOURAGE[Math.floor(Math.random() * ENCOURAGE.length)] + "</strong>" +
        "<span>" + q.explain + "</span>";
    } else {
      el.feedback.className = "feedback bad";
      const ans = q.choices[q.correct];
      const why = timedOut
        ? "Time's up! The answer is <strong>" + q.correct + ". " + ans + "</strong>."
        : "Not quite — correct answer is <strong>" + q.correct + ". " + ans + "</strong>.";
      el.feedback.innerHTML = "<strong>" + why + "</strong><span>" + q.explain + "</span>";
    }

    el.scoreLabel.textContent = "Score: " + state.score;
    el.progressFill.style.width = ((state.index + 1) / state.questions.length) * 100 + "%";
    el.btnNext.hidden = false;
    el.btnNext.textContent =
      state.index >= state.questions.length - 1 ? "See results" : "Next";
    el.btnNext.focus();
  }

  function nextOrFinish() {
    if (!state.answered) return;
    if (state.index >= state.questions.length - 1) {
      showResults();
      return;
    }
    state.index += 1;
    renderQuestion();
  }

  function topWeakTags(limit) {
    const entries = Object.keys(state.sessionWrongTags).map(function (k) {
      return [k, state.sessionWrongTags[k]];
    });
    Object.keys(progress.tags).forEach(function (tag) {
      const tg = progress.tags[tag];
      if (tg.wrong > tg.correct) {
        let found = null;
        for (let i = 0; i < entries.length; i++) {
          if (entries[i][0] === tag) { found = entries[i]; break; }
        }
        if (found) found[1] += tg.wrong - tg.correct;
        else entries.push([tag, tg.wrong - tg.correct]);
      }
    });
    entries.sort(function (a, b) { return b[1] - a[1]; });
    return entries.slice(0, limit);
  }

  function friendlyTag(tag) {
    const map = {

      term: "Common terms", build: "Build-a-word", clinical: "Clinical terms",

      cardio: "Heart (cardi/o)", neuro: "Nerves (neur/o)", gastro: "Stomach (gastr/o)",

      dys: "dys- (difficult)", poly: "poly- (many)", itis: "-itis (inflammation)",
      ectomy: "-ectomy (removal)", scopy: "-scopy (viewing)", pathy: "-pathy (disease)",
      algia: "-algia (pain)", emia: "-emia (blood condition)", oma: "-oma (tumor)",
      hosa: "HOSA-style analysis"
    };
    return map[tag] || tag;
  }

  function showResults() {
    stopTimer();
    const total = state.questions.length;
    const score = state.score;
    const pct = total ? Math.round((score / total) * 100) : 0;
    maybeUnlock();
    saveProgress();

    const modeNames = { practice: "Practice", focus: "Focus Weak Spots", challenge: "Challenge Quiz" };
    el.resultsMode.textContent = modeNames[state.mode] || "Quiz";
    el.resultsScore.textContent = String(score);
    el.resultsTotal.textContent = String(total);

    let headline = "Nice work!";
    let message = "Keep practicing — every word part you learn sticks for HOSA.";
    if (pct === 100) { headline = "Perfect!"; message = "Incredible — you crushed every question."; }
    else if (pct >= 90) { headline = "Outstanding!"; message = "Almost perfect. A quick review and you're quiz-ready."; }
    else if (pct >= 75) { headline = "Great job!"; message = "Strong session. Harder tiers unlock as your accuracy stays high."; }
    else if (pct >= 50) { headline = "Good effort!"; message = "You're learning. Use Focus Weak Spots on the tags below."; }
    else { headline = "Keep going!"; message = "Medical terms take practice. Read the teach notes and try again."; }

    el.resultsHeadline.textContent = headline;
    el.resultsMessage.textContent = message;

    const u = progress.unlockedTier;
    el.resultsTier.textContent = "Level " + u + " · " + TIER_BLURBS[u];
    el.resultsMeter.style.width = masteryPercent() + "%";
    const answered = progress.totalAnswered || 0;
    const correct = progress.totalCorrect || 0;
    const life = answered ? Math.round((correct / answered) * 100) : 0;
    el.resultsStats.innerHTML =
      "<span>Session " + pct + "%</span>" +
      "<span>Lifetime " + life + "%</span>" +
      "<span>Unlocked through L" + u + "</span>";
    renderTierPills(el.resultsPills);

    const weak = topWeakTags(5);
    if (weak.length && pct < 100) {
      el.reviewBox.hidden = false;
      el.reviewList.innerHTML = weak.map(function (pair) {
        return "<li>" + friendlyTag(pair[0]) + "</li>";
      }).join("");
    } else {
      el.reviewBox.hidden = true;
      el.reviewList.innerHTML = "";
    }

    showScreen("results");
  }

  function quitToHome() {
    stopTimer();
    refreshHome();
    showScreen("home");
  }

  function resetProgress() {
    if (!confirm("Reset all HOSA quiz progress for Saanjh on this device?")) return;
    progress = defaultProgress();
    saveProgress();
    refreshHome();
  }

  function bindTap(id, fn) {
    const node = document.getElementById(id);
    if (!node) return;
    let last = 0;
    function run(e) {
      const now = Date.now();
      if (now - last < 400) return;
      last = now;
      fn(e);
    }
    node.addEventListener("click", run);
    node.addEventListener("touchend", run, { passive: true });
  }
  window.startHosaSession = startSession;
  bindTap("btn-practice", function () { startSession("practice"); });
  bindTap("btn-focus", function () { startSession("focus"); });
  bindTap("btn-challenge", function () { startSession("challenge"); });
  document.getElementById("btn-reset").addEventListener("click", resetProgress);
  document.getElementById("btn-quit").addEventListener("click", quitToHome);
  document.getElementById("btn-home-mid").addEventListener("click", quitToHome);
  document.getElementById("btn-next").addEventListener("click", nextOrFinish);
  document.getElementById("btn-again").addEventListener("click", function () { startSession(state.lastMode || "practice"); });
  document.getElementById("btn-results-home").addEventListener("click", quitToHome);

  refreshHome();
  showScreen("home");
})();

  </script>
</body>
</html>
